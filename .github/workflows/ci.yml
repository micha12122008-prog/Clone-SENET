name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint client
        run: npm run lint

      - name: Build client
        run: npm run build

  admin:
    name: Admin (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint admin
        run: npm run lint

      - name: Build admin
        run: npm run build

  backend:
    name: Backend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
          fi

      - name: Lint backend
        run: |
          if [ -f node_modules/.bin/eslint ]; then
            npm run lint
          elif [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "Backend skeleton: no linter configured yet"
          fi

      - name: Build backend
        run: npm run build --if-present

